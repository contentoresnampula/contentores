<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="theme-color" content="#2f7d46"><meta name="mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contentores Nampula</title>
<style>
:root{--bg:#f4f6f2;--c:#fff;--t:#1b2a1e;--m:#5f6d62;--b:#d9dfd6;--g:#2f7d46;--y:#c99700;--r:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131a14;--c:#1d261f;--t:#e7eee8;--m:#9aa99d;--b:#2e3a30}}
:root[data-theme="dark"]{--bg:#131a14;--c:#1d261f;--t:#e7eee8;--m:#9aa99d;--b:#2e3a30}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif;max-width:560px;margin:auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 2px;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:10px;font-size:13px}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
select,input[type=text],input[type=password]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--bg);color:var(--t);font-size:16px}
.pcts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pcts button{padding:10px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:14px}
.pcts button.on{background:var(--g);color:#fff}
.big{width:100%;padding:13px;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:16px;margin-top:12px}
.sm{padding:7px 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:13px;margin:6px 6px 0 0;text-decoration:none;display:inline-block}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}
img.f{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-top:8px}
.m{color:var(--m);font-size:13px}.st{display:flex;gap:8px;margin-bottom:10px}.st div{flex:1;text-align:center}.st b{display:block;font-size:22px}
</style></head><body>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><button class="sm" id="burger" style="font-size:22px;margin:0;padding:4px 12px" aria-label="Menu">☰</button><h1 style="margin:0">♻️ Contentores de Nampula</h1></div>
<div id="menu" class="card" style="display:none;margin-bottom:12px"><button class="sm" data-go="0" style="display:block;width:100%;margin:0 0 8px;padding:12px;text-align:left">📝 Reportar um contentor</button><button class="sm" data-go="1" style="display:block;width:100%;margin:0 0 8px;padding:12px;text-align:left">🚛 Equipa de campo</button><button class="sm" data-go="2" style="display:block;width:100%;margin:0 0 8px;padding:12px;text-align:left">🔐 Administrador</button><button class="sm" data-go="i" style="display:block;width:100%;margin:0;padding:12px;text-align:left">ℹ️ Sobre o projeto</button></div>
<div class="tabs" style="display:none"><button id="t0">Morador</button><button id="t1">Campo</button><button id="t2">Admin</button></div>
<div id="v"></div>
<script>
const BAIRROS=["Central","Bombeiros","25 de Setembro","1.º de Maio","Limoeiros","Militar","Muatala","Mutauanha","Muhala","Namutequeliua","Muahivire","Namicopo","Mutava-Rex","Napipine","Carrupeia","Natikiri","Marrupaniua","Marrere"];
const CFG=(()=>{try{return JSON.parse(localStorage.getItem("cfg"))||{}}catch(e){return{}}})();
CFG.admin=CFG.admin||"admin123";CFG.campo=CFG.campo||"CAMPO2026";
CFG.bio=CFG.bio||"João Celestino é geólogo e vive em Nampula-cidade. É Técnico em Geologia e Técnico Auxiliar em Mineração (Instituto Médio de Geologia e Minas de Moatize) e tem formação em Modelação 3D e em Modelagem Espacial de Riscos Ambientais com SIG. Criou esta ferramenta para ajudar Nampula a manter as ruas limpas, usando a localização e os dados para decidir melhor onde e quando recolher o lixo.";
const saveCfg=()=>{try{localStorage.setItem("cfg",JSON.stringify(CFG))}catch(e){}};
const ESTADOS=["Reportado","Mandado recolher","Em recolha","Recolhido"];
const COR=["#c0392b","#d9822b","#c99700","#2f7d46"];
let intro=!localStorage.getItem("intro"),tab=0,rows=[],PW="",role="",adminOk=false,campoOk=false,pct=50,foto=null,pos=null,msg="";
function LS0(){try{return JSON.parse(localStorage.getItem("rep")||"[]")}catch(e){return[]}}
const $=s=>document.querySelector(s);
const LS={get(){try{return JSON.parse(localStorage.getItem("rep")||"[]")}catch(e){return[]}},set(v){try{localStorage.setItem("rep",JSON.stringify(v))}catch(e){}}};
draw();
const URL_API="https://script.google.com/macros/s/AKfycbxTGFkUwH_wNcJxidHLcnFAYlK_ZnYV1reojVLDQL5gYhNvYftCq_nKj3OVSHe4couXaQ/exec";
async function api(b){try{const r=await fetch(URL_API,{method:"POST",body:JSON.stringify({...b,pw:PW})});const j=await r.json();if(j.ok)load(true);return j.ok}catch(e){return false}}
async function load(quiet){try{const r=await fetch(URL_API+"?pw="+encodeURIComponent(PW));const j=await r.json();rows=(j.rows||[]).sort((a,b)=>(a.estado==="Recolhido")-(b.estado==="Recolhido")||b.pct-a.pct||a.ts-b.ts);role=j.role||""}catch(e){if(!quiet)msg="Sem ligação ao servidor."}
  if(!quiet||(tab!==0&&!intro))draw()}
async function upd(id,estado){await api({action:"estado",id,estado})}
let wid=null;
function pegarGPS(){
  if(!navigator.geolocation){msg="Este navegador não suporta localização. Abra o link no Chrome ou no Safari.";draw();return}
  if(wid!==null){navigator.geolocation.clearWatch(wid);wid=null}
  let best=null;
  msg="A obter a localização exata… aguarde até 40 segundos e, se possível, fique ao ar livre.";draw();
  const parar=()=>{if(wid!==null){navigator.geolocation.clearWatch(wid);wid=null}};
  const fecha=()=>{parar();
    if(best&&best.coords.accuracy<=100){pos={lat:+best.coords.latitude.toFixed(6),lng:+best.coords.longitude.toFixed(6),acc:Math.round(best.coords.accuracy)};msg="✅ Localização obtida (precisão de cerca de "+pos.acc+" m).";}
    else msg=best?"A localização está pouco precisa (cerca de "+Math.round(best.coords.accuracy)+" m). Vá para um sítio aberto, ligue a localização precisa e toque outra vez.":"Não foi possível obter a localização. Ligue a localização do telemóvel e, se abriu o link pelo WhatsApp ou Facebook, abra-o no Chrome ou no Safari.";
    draw()};
  const tm=setTimeout(fecha,40000);
  wid=navigator.geolocation.watchPosition(p=>{if(!best||p.coords.accuracy<best.coords.accuracy)best=p;if(p.coords.accuracy<=30){clearTimeout(tm);fecha()}},e=>{if(e.code===1){clearTimeout(tm);parar();msg="Localização bloqueada. Permita a localização para este site, nas definições do navegador e do telemóvel, e tente outra vez.";draw()}},{enableHighAccuracy:true,timeout:30000,maximumAge:0});
}
function reduzir(file){
  const img=new Image,url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,520/img.width),c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);foto=c.toDataURL("image/jpeg",.6);URL.revokeObjectURL(url);draw()};
  img.src=url;
}
async function enviar(){
  const b=$("#bairro").value;
  if(!b||!pos||!foto){msg="Falta bairro, foto ou localização.";draw();return}
  msg="A enviar…";draw();if(!await api({action:"novo",bairro:b,pct,lat:pos.lat,lng:pos.lng,foto})){msg="Falhou. Verifique a internet e tente de novo.";draw();return}
  foto=null;pos=null;msg="✅ Reporte enviado. Obrigado!";draw();
}
const fmt=t=>new Date(t).toLocaleString("pt-PT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const maps=r=>"https://www.google.com/maps?q="+r.lat+","+r.lng;
const urg=p=>p>=100?"#c0392b":p>=75?"#d9822b":"#c99700";
function item(r,acoes){const uc=r.estado==="Recolhido"?"#2f7d46":urg(r.pct);
  return `<div class="card" style="border-left:6px solid ${uc}"><b>${r.bairro}</b> <span class="tag" style="background:${uc}">${r.pct>=125?"Transbordando":r.pct+"%"}</span> <span class="tag" style="background:${COR[ESTADOS.indexOf(r.estado)]}">${r.estado}</span>
  <div class="m">${fmt(r.ts)} · ${r.lat}, ${r.lng}</div>${r.foto?`<img class="f" src="${r.foto}">`:""}
  <a class="sm" href="${maps(r)}" target="_blank" rel="noopener">📍 Ver no Google Maps</a>${acoes||""}</div>`;
}
function vMorador(){
  return `<div class="card"><label>1. Foto do contentor</label>
  <input type="file" accept="image/*" capture="environment" id="ff">${foto?`<img class="f" src="${foto}">`:""}
  <label>2. Localização</label><button class="sm" id="gps">📍 ${pos?pos.lat+", "+pos.lng:"Obter localização"}</button>
  <label>3. Bairro</label><select id="bairro"><option value="">Escolher…</option>${BAIRROS.map(b=>`<option>${b}</option>`).join("")}</select>
  <label>4. Quanto está cheio?</label><div class="pcts">${[25,50,75,100,125].map(p=>`<button data-p="${p}" class="${p===pct?"on":""}">${p===125?"Transb.":p+"%"}</button>`).join("")}</div>
  <button class="big" id="env">Enviar reporte</button><p class="m">${msg}</p></div>`;
}
let ctab=0;
const perSel=()=>`<label>Período</label><select id="per">${["Tudo","Hoje","Últimos 7 dias","Últimos 30 dias"].map((x,i)=>`<option value="${i}" ${i===per?"selected":""}>${x}</option>`).join("")}</select>`;
const HC=["Bairro","Aguardam","Em recolha","Recolhidos","h Recolha","h Mandado→Recolhido"];
function tabC(){const f=filt();return [["TOTAL",f]].concat(BAIRROS.map(b=>[b,f.filter(r=>r.bairro===b)]).filter(x=>x[1].length)).map(([b,rs])=>[b,rs.filter(r=>r.estado==="Mandado recolher").length,rs.filter(r=>r.estado==="Em recolha").length,rs.filter(r=>r.estado==="Recolhido").length,hh(rs,"tf","tr"),hh(rs,"tf","tm")])}
function vRelCampo(){
  const D=tabC(),td="padding:6px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap";
  return perSel()+`<p class="m">Recolhas da equipa por bairro. Tempos em horas.</p><div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px"><tr>${HC.map((c,k)=>`<th style="${td};${k?"":"text-align:left"}">${c}</th>`).join("")}</tr>${D.map(l=>`<tr>${l.map((v,k)=>`<td style="${td};${k?"":"text-align:left;font-weight:600"}">${v===null?"–":v}</td>`).join("")}</tr>`).join("")}</table></div>
  <button class="sm" id="c1">⬇️ CSV</button><button class="sm" id="c2">🖼 Imagem</button><button class="sm" id="c3">📄 PDF</button>`;
}
function vCampo(){
  if(!campoOk)return `<div class="card"><label>Código de acesso da equipa</label><input type="password" id="cod"><button class="big" id="ok">Entrar</button><p class="m">${msg}</p></div>`;
  const sub=`<div class="tabs"><button class="${ctab===0?"on":""}" data-c="0">Recolher</button><button class="${ctab===1?"on":""}" data-c="1">Relatório</button></div>`;
  if(ctab===1)return sub+vRelCampo();
  const l=rows.filter(r=>r.estado==="Mandado recolher"||r.estado==="Em recolha");
  return sub+`<p class="m">${l.length} contentor(es) para recolher</p>`+(l.map(r=>item(r,r.estado==="Mandado recolher"?`<button class="sm" data-e="${r.id}|Em recolha">🚛 Em recolha</button>`:`<button class="sm" data-e="${r.id}|Recolhido">✅ Recolhido</button>`)).join("")||`<div class="card m">Nada para recolher.</div>`);
}
function vAdmin0(){
  if(!adminOk)return `<div class="card"><label>Palavra-passe do administrador</label><input type="password" id="pw"><button class="big" id="adm">Entrar</button><p class="m">${msg}</p></div>`;
  const n=i=>rows.filter(r=>r.estado===ESTADOS[i]).length;
  const fin=rows.filter(r=>r.tf&&r.estado==="Recolhido");
  const med=fin.length?Math.round(fin.reduce((a,r)=>a+(r.tf-r.ts),0)/fin.length/36e5*10)/10:"–";
  return `<div class="st">${ESTADOS.map((e,i)=>`<div class="card"><b>${n(i)}</b><span class="m">${e}</span></div>`).join("")}</div>
  <p class="m">Tempo médio até à recolha: ${med} h · <button class="sm" id="csv">⬇️ Exportar CSV (QGIS)</button></p>
  <div class="card"><b>Definições</b><label>Nova palavra-passe do administrador</label><input type="text" id="np"><label>Novo código da equipa de campo</label><input type="text" id="nc" placeholder="deixe vazio para manter"><button class="big" id="sv">Guardar</button><button class="sm" id="out">Sair</button><p class="m">${msg}</p></div>`+
  rows.filter(r=>r.estado!=="Recolhido").map(r=>item(r,(r.estado==="Reportado"?`<button class="sm" data-e="${r.id}|Mandado recolher">📢 Mandar recolher</button>`:"")+(r.estado!=="Recolhido"?`<button class="sm" data-e="${r.id}|Recolhido">✅ Recolhido</button>`:"")+`<button class="sm" data-del="${r.id}">🗑 Eliminar</button>`)).join("");
}
let atab=0,per=0;
const DIAS=[0,1,7,30],COLS=["Pedidos","Pendentes","Mandados ao campo","Em recolha","Recolhidos","Críticos (≥100%)","% médio","h Morador→Admin","h Admin→Campo","h Recolha","h Total"];
function filt(){const d=DIAS[per];return d?rows.filter(r=>r.ts>=Date.now()-d*864e5):rows}
const hh=(rs,b,a)=>{const x=rs.filter(r=>r[b]&&r[a]).map(r=>r[b]-r[a]);return x.length?Math.round(x.reduce((p,q)=>p+q,0)/x.length/36e5*10)/10:null};
function est(rs){return [rs.length,rs.filter(r=>r.estado==="Reportado").length,rs.filter(r=>r.tm).length,rs.filter(r=>r.estado==="Em recolha").length,rs.filter(r=>r.estado==="Recolhido").length,rs.filter(r=>r.pct>=100).length,rs.length?Math.round(rs.reduce((a,r)=>a+r.pct,0)/rs.length):null,hh(rs,"tm","ts"),hh(rs,"tr","tm"),hh(rs,"tf","tr"),hh(rs,"tf","ts")]}
function tabela(){const f=filt();return [["TOTAL",f]].concat(BAIRROS.map(b=>[b,f.filter(r=>r.bairro===b)]).filter(x=>x[1].length)).map(([b,rs])=>[b].concat(est(rs)))}
function dl(n,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download=n;a.click()}
function vRelAdm(){
  const T=tabela(),td="padding:6px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap";
  return `<label>Período</label><select id="per">${["Tudo","Hoje","Últimos 7 dias","Últimos 30 dias"].map((x,i)=>`<option value="${i}" ${i===per?"selected":""}>${x}</option>`).join("")}</select>
  <p class="m">Pedidos, mandados ao campo e recolhas por bairro. Tempos em horas.</p>
  <div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px"><tr><th style="${td};text-align:left">Bairro</th>${COLS.map(c=>`<th style="${td}">${c}</th>`).join("")}</tr>
  ${T.map(l=>`<tr><td style="${td};text-align:left"><b>${l[0]}</b></td>${l.slice(1).map(v=>`<td style="${td}">${v===null?"–":v}</td>`).join("")}</tr>`).join("")}</table></div>
  <button class="sm" id="dl1">⬇️ Relatório por bairro (CSV)</button><button class="sm" id="dl2">⬇️ Todos os pedidos (CSV)</button><button class="sm" id="dl3">🖼 Imagem</button><button class="sm" id="dl4">📄 PDF</button>`;
}
function vArq(){
  const l=rows.filter(r=>r.estado==="Recolhido").sort((a,b)=>(b.tf||b.ts)-(a.tf||a.ts));
  return `<p class="m">${l.length} pedido(s) arquivado(s). Continuam a contar nos relatórios.</p>
  <div class="card"><label>Eliminar vários</label><select id="olds"><option value="30">Arquivados há mais de 30 dias</option><option value="60">Arquivados há mais de 60 dias</option><option value="90">Arquivados há mais de 90 dias</option><option value="0">Todos os arquivados</option></select><button class="big" id="delmany" style="background:var(--r)">Eliminar vários</button></div>`+(l.map(r=>item(r,`<button class="sm" data-del="${r.id}">🗑 Eliminar</button>`)).join("")||`<div class="card m">O arquivo está vazio.</div>`);
}
function vAdmin(){
  if(!adminOk)return vAdmin0();
  const t=["Ativos","Arquivo","Relatório"].map((n,k)=>`<button class="${atab===k?"on":""}" data-a="${k}">${n}</button>`).join("");
  return `<div class="tabs">${t}</div>`+[vAdmin0,vArq,vRelAdm][atab]();
}
const HA=["Bairro","Pedidos","Pend.","Mandad.","Em rec.","Recolh.","Crít.","% méd.","h M→A","h A→C","h Rec.","h Total"];
function toImg(t,head,data){
  const cw=[150].concat(head.slice(1).map(()=>76)),W=cw.reduce((a,b)=>a+b,0)+40,H=110+data.length*30;
  const c=document.createElement("canvas");c.width=W*2;c.height=H*2;const x=c.getContext("2d");x.scale(2,2);
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.textAlign="left";x.fillStyle="#1b2a1e";x.font="bold 18px sans-serif";x.fillText(t,20,34);
  x.font="12px sans-serif";x.fillStyle="#5f6d62";x.fillText("Contentores de Nampula · "+new Date().toLocaleString("pt-PT")+" · "+["Todo o período","Hoje","Últimos 7 dias","Últimos 30 dias"][per],20,56);
  let y=84;[head].concat(data).forEach((row,i)=>{
    if(i===0){x.fillStyle="#2f7d46";x.fillRect(20,y-18,W-40,28)}else if(i%2===0){x.fillStyle="#f2f5f0";x.fillRect(20,y-18,W-40,28)}
    let px=20;row.forEach((v,j)=>{x.fillStyle=i===0?"#fff":"#1b2a1e";x.font=(i<2?"bold ":"")+"11px sans-serif";x.textAlign=j?"right":"left";x.fillText(v===null?"–":String(v),j?px+cw[j]-8:px+8,y);px+=cw[j]});y+=30});
  const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="relatorio.png";a.click();
}
function toPdf(t,head,data){
  const w=window.open("","_blank");if(!w){alert("Permita janelas pop-up para gerar o PDF.");return}
  w.document.write(`<title>${t}</title><body style="font-family:sans-serif"><h2>${t}</h2><p>Contentores de Nampula · ${new Date().toLocaleString("pt-PT")}</p><table border="1" cellspacing="0" cellpadding="5" style="border-collapse:collapse;font-size:12px"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${data.map(r=>`<tr>${r.map(v=>`<td>${v===null?"–":v}</td>`).join("")}</tr>`).join("")}</table><p style="font-size:12px">Para guardar em PDF, escolha "Guardar como PDF" na impressão.</p>`);
  w.document.close();w.focus();setTimeout(()=>w.print(),300);
}
function exportar(){
  const h="bairro,percentagem,lat,lng,data,estado\n"+rows.map(r=>[r.bairro,r.pct,r.lat,r.lng,new Date(r.ts).toISOString(),r.estado].join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/csv"}));a.download="reportes.csv";a.click();
}
function avg(a){return a.length?(Math.round(a.reduce((x,y)=>x+y,0)/a.length/36e5*10)/10)+" h":"–"}
const gap=(rs,b,a)=>avg(rs.filter(r=>r[b]&&r[a]).map(r=>r[b]-r[a]));
function linhas(){return [["Todos os bairros",rows]].concat(BAIRROS.map(b=>[b,rows.filter(r=>r.bairro===b)]).filter(x=>x[1].length)).map(([b,rs])=>({b,n:rs.length,p:rs.filter(r=>r.estado!=="Recolhido").length,a:gap(rs,"tm","ts"),c:gap(rs,"tr","tm"),d:gap(rs,"tf","tr"),t:gap(rs,"tf","ts")}))}
function vRel(){
  const L=linhas();
  if(!rows.length)return `<div class="card m">Ainda não há reportes.</div>`;
  return `<p class="m">Tempos médios entre cada etapa, por bairro. Dados abertos para todos.</p><button class="sm" id="csv2">⬇️ Exportar relatório (CSV)</button>`+L.map(l=>`<div class="card"><b>${l.b}</b> <span class="m">· ${l.n} reporte(s) · ${l.p} pendente(s)</span>
  <div class="m">① Morador → Admin manda recolher: <b>${l.a}</b></div>
  <div class="m">② Admin → Campo inicia: <b>${l.c}</b></div>
  <div class="m">③ Campo: recolha concluída: <b>${l.d}</b></div>
  <div style="margin-top:6px">Tempo total (reporte → recolhido): <b>${l.t}</b></div></div>`).join("");
}
function vIntro(){
  return `<div class="card"><b style="font-size:18px">Bem-vindo</b>
  <p class="m">Quem criou</p><p style="margin:0"><b style="font-size:17px">João Celestino</b></p><div style="margin:6px 0">${["Natural de Nampula","Geólogo","Modelador 3D","Técnico de SIG"].map(t=>`<span class="tag" style="background:var(--g);margin:0 6px 6px 0">${t}</span>`).join("")}</div><p>Jovem com muita vontade de aprofundar os seus conhecimentos em geociências e ambiente. Criou esta ferramenta para ajudar Nampula a manter as ruas limpas, usando a localização e os dados para decidir melhor onde e quando recolher o lixo.</p>
  <p class="m">Objectivos</p><ul><li>Evitar lixo espalhado na rua quando os contentores enchem.</li><li>Avisar rapidamente a equipa, com foto e localização exata.</li><li>Dar transparência: medir quanto tempo demora cada etapa, bairro a bairro.</li></ul>
  <p class="m">Recomendações aos moradores</p><ul><li>Tire a foto junto ao contentor, com o contentor e o lixo à volta bem visíveis.</li><li>Ative a localização do telemóvel antes de enviar.</li><li>Faça um reporte por contentor por dia; não repita.</li><li>Deite o lixo dentro do contentor e nunca queime.</li></ul>
  <p class="m">Quando alertar</p><ul><li><b>75%:</b> quase cheio, bom momento para avisar.</li><li><b>100%:</b> cheio, avise já.</li><li><b>Transbordando:</b> urgente, há lixo no chão.</li></ul>
  <p class="m">Esta aplicação não serve para emergências de saúde ou segurança.</p>
  <button class="big" id="go">Começar</button></div>`;
}
function draw(){
  [0,1,2].forEach(i=>$("#t"+i).className=i===tab?"on":"");document.querySelector(".tabs").style.display="none";
  const keep=$("#bairro")?$("#bairro").value:"";
  $("#v").innerHTML=intro?vIntro():[vMorador,vCampo,vAdmin][tab]();
  const go=$("#go");if(go)go.onclick=()=>{intro=false;try{localStorage.setItem("intro","1")}catch(e){}draw()};
  const c2=$("#csv2");if(c2)c2.onclick=()=>{const h="bairro,reportes,pendentes,morador_ate_admin,admin_ate_campo,recolha,total\n"+linhas().map(l=>[l.b,l.n,l.p,l.a,l.c,l.d,l.t].join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/csv"}));a.download="relatorio.csv";a.click()};
  if($("#bairro"))$("#bairro").value=keep;
  const g=$("#gps");if(g)g.onclick=pegarGPS;
  const ff=$("#ff");if(ff)ff.onchange=e=>e.target.files[0]&&reduzir(e.target.files[0]);
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pct=+b.dataset.p;draw()});
  const e=$("#env");if(e)e.onclick=enviar;
  const ok=$("#ok");if(ok)ok.onclick=async()=>{PW=$("#cod").value;await load(true);if(role==="campo"||role==="admin"){campoOk=true;msg=""}else{msg="Código errado.";PW=""}draw()};
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const[i,s]=b.dataset.e.split("|");upd(i,s)});
  const c=$("#csv");if(c)c.onclick=exportar;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{atab=+b.dataset.a;draw()});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ctab=+b.dataset.c;draw()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Eliminar este pedido? Ele deixa de contar nos relatórios."))api({action:"apagar",ids:[b.dataset.del]})});
  const dm=$("#delmany");if(dm)dm.onclick=()=>{const n=+$("#olds").value,lim=Date.now()-n*864e5,ids=rows.filter(r=>r.estado==="Recolhido"&&(n===0||(r.tf||r.ts)<lim)).map(r=>r.id);if(!ids.length){alert("Não há pedidos nesse critério.");return}if(confirm("Eliminar "+ids.length+" pedido(s) arquivado(s)? Deixam de contar nos relatórios. Exporte o CSV antes, se quiser guardar."))api({action:"apagar",ids})};
  const i3=$("#dl3");if(i3)i3.onclick=()=>toImg("Relatório por bairro",HA,tabela());
  const i4=$("#dl4");if(i4)i4.onclick=()=>toPdf("Relatório por bairro",HA,tabela());
  const k1=$("#c1");if(k1)k1.onclick=()=>dl("relatorio_campo.csv",HC.join(",")+"\n"+tabC().map(l=>l.map(v=>v===null?"":v).join(",")).join("\n"));
  const k2=$("#c2");if(k2)k2.onclick=()=>toImg("Relatório da equipa de campo",HC,tabC());
  const k3=$("#c3");if(k3)k3.onclick=()=>toPdf("Relatório da equipa de campo",HC,tabC());
  const pe=$("#per");if(pe)pe.onchange=()=>{per=+pe.value;draw()};
  const d1=$("#dl1");if(d1)d1.onclick=()=>dl("relatorio_bairros.csv",["bairro"].concat(COLS).join(",")+"\n"+tabela().map(l=>l.map(v=>v===null?"":v).join(",")).join("\n"));
  const d2=$("#dl2");if(d2)d2.onclick=()=>{const t=x=>x?new Date(x).toISOString():"";const h=(a,b)=>a&&b?Math.round((a-b)/36e5*100)/100:"";dl("pedidos.csv","id,bairro,pct,lat,lng,estado,data_pedido,data_mandado,data_inicio_recolha,data_recolhido,h_total\n"+filt().map(r=>[r.id,r.bairro,r.pct,r.lat,r.lng,r.estado,t(r.ts),t(r.tm),t(r.tr),t(r.tf),h(r.tf,r.ts)].join(",")).join("\n"))};
  const ad=$("#adm");if(ad)ad.onclick=async()=>{PW=$("#pw").value;await load(true);if(role==="admin"){adminOk=true;msg=""}else{msg="Palavra-passe errada.";PW=""}draw()};
  const sv=$("#sv");if(sv)sv.onclick=async()=>{const p=$("#np").value.trim(),k=$("#nc").value.trim();const ok=await api({action:"config",admin:p,campo:k});if(ok&&p)PW=p;msg=ok?"✅ Guardado.":"Falhou.";draw()};
  const ot=$("#out");if(ot)ot.onclick=()=>{adminOk=false;msg="";draw()};
}
[0,1,2].forEach(i=>$("#t"+i).onclick=()=>{tab=i;msg="";draw()});
$("#burger").onclick=()=>{const m=$("#menu");m.style.display=m.style.display==="none"?"block":"none"};
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const g=b.dataset.go;$("#menu").style.display="none";msg="";if(g==="i")intro=true;else{intro=false;tab=+g}draw()});
load();setInterval(()=>load(true),15000);
</script></body></html>
